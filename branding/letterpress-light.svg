<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
  Moderado Desktop watermark, light theme.

  Overlays src/vs/workbench/browser/parts/editor/media/letterpress-light.svg.
  That is the mark shown in the centre of an empty editor area. VSCodium replaces
  it with its own Codium letterpress, which is why the canvas kept showing the
  VSCodium logo after code-icon.svg was branded.

  The upstream mark is a single flat glyph at low opacity, so this one is too: a
  monochrome "M" in the same 40x40 box, with upstream's light-theme opacity.
  Geometry is branding/code-icon.svg scaled by 0.4 into this 40-unit box.
-->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0" y="0" width="40" height="40" viewBox="0 0 40 40">
  <g id="moderado_grey_light_letterpress" fill="none" stroke="#B2B2B2" stroke-opacity="0.1"
     stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.2,29.6 L11.2,15.2 L20,22.4 L28.8,15.2 L28.8,29.6"/>
  </g>
</svg>