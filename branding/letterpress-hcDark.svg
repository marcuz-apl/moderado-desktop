<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
  Moderado Desktop watermark, high-contrast dark theme.

  Overlays src/vs/workbench/browser/parts/editor/media/letterpress-hcDark.svg.
  Upstream paints this variant #3C3C3C at full opacity; that is kept so the mark
  stays legible without competing with high-contrast text.
-->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0" y="0" width="40" height="40" viewBox="0 0 40 40">
  <g id="moderado_grey_hc_dark_letterpress" fill="none" stroke="#3C3C3C"
     stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.2,29.6 L11.2,15.2 L20,22.4 L28.8,15.2 L28.8,29.6"/>
  </g>
</svg>