<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
  Moderado Desktop watermark, dark theme.

  Overlays src/vs/workbench/browser/parts/editor/media/letterpress-dark.svg, the
  mark shown in the centre of an empty editor area on a dark theme. See
  letterpress-light.svg for why the centre-canvas watermark needed its own
  overlay rather than reusing code-icon.svg.

  Upstream's dark mark is flat at 0.3 opacity, so this monochrome "M" matches it.
-->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0" y="0" width="40" height="40" viewBox="0 0 40 40">
  <g id="moderado_grey_dark_letterpress" fill="none" stroke="#B2B2B2" stroke-opacity="0.3"
     stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.2,29.6 L11.2,15.2 L20,22.4 L28.8,15.2 L28.8,29.6"/>
  </g>
</svg>