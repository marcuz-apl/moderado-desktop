[package]
name = "moderado-desktop"
version = "0.4.0"
edition = "2021"

[lib]
name = "moderado_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
cap-std = "4.0"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Environment"] }

[dev-dependencies]
tempfile = "3"
