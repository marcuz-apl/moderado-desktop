[package]
name = "moderado-desktop"
version = "0.4.49"
edition = "2021"

[lib]
name = "moderado_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
getrandom = "0.2"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
cap-std = "4.0"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process", "io-util"] }
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.8"
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Both Windows bindings are already in the graph through Tauri (windows 0.62
# arrives via tao/wry, windows-sys 0.61 via cap-std and dirs), so declaring them
# directly adds no crate versions — only features. windows-sys carries the
# sandbox calls in command.rs; windows is needed because `WebviewWindow::hwnd`
# hands back its HWND newtype, which the DWM call in lib.rs takes as-is.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Environment"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
# The shipped binary is built once per release and run every day, so trade build
# time for a smaller, faster executable. Thin LTO keeps the link step minutes
# rather than tens of minutes; strip drops the symbol table nothing reads.
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
